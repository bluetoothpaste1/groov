[package]
name = "groov"
version = "1.0.0"
edition = "2021"
description = "A portable, extensible terminal music player"
license = "MIT"
repository = "https://github.com/skripsaha/groov"
readme = "README.md"
keywords = ["terminal", "music", "player", "tui", "plugins"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
crossterm = "0.29.0"
libc = "0.2.191"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-image = { version = "1.0.5", default-features = false, features = ["crossterm", "rustix"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"

[dev-dependencies]
tempfile = "3.16.0"

[[bin]]
name = "groov"
path = "src/main.rs"
